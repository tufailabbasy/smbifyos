services:
  - type: web
    name: smbify-os
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/tufailabbasy/smbifyos
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm --prefix client ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://smbify-os.onrender.com,https://smbifyos.app,https://www.smbifyos.app
      - key: APP_BASE_URL
        value: https://smbifyos.app
      - key: APP_URL
        value: https://smbifyos.app
      - key: OUTBOUND_EMAIL_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
