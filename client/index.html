<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMBify OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent flash of wrong theme — applies saved preference before first paint
      (function(){var t=localStorage.getItem('smbify-lead-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <style>html{background-color:#0a0a0a}html[data-theme="light"]{background-color:#fff}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
